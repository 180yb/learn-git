<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的小站</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, #0b1f33 0%, #123a5a 55%, #1b5e8a 100%);
      color: #eaf4ff;
    }
    main { text-align: center; padding: 2rem; }
    h1 { font-size: clamp(1.8rem, 6vw, 3rem); margin: 0 0 .6rem; letter-spacing: .04em; }
    p  { margin: .4rem 0; opacity: .85; }
    .tag { display: inline-block; margin-top: 1.4rem; padding: .4rem .9rem;
           border: 1px solid rgba(234,244,255,.4); border-radius: 999px; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <h1>🐋 我的小站</h1>
    <p>这里以后会放我做的东西：小工具、笔记、还有几条鱼。欢迎路过。</p>
    <p>现在先用来学 Git 和 GitHub Pages。</p>
    <div class="tag">version 0.2</div>
  </main>
</body>
</html>
